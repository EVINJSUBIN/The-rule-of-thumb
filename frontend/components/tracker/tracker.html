<!-- Coding Time Tracker View Component (v0 / shadcn Minimalist Dark Aesthetic) -->
<div id="view-tracker" class="tab-view">
  <div class="tracker-card">
    <div class="badge-pill info" style="margin-bottom: 0.5rem;">OFFLINE SESSION TRACKER</div>
    <h2 style="color: #ffffff; font-weight: 700; margin-top: 0.5rem; letter-spacing: -0.3px;">Live Coding Session</h2>
    <div class="timer-display" id="timer-display">00:00:00</div>
    
    <div style="display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 1.5rem;">
      <button class="btn btn-primary" id="timer-toggle-btn" onclick="toggleTimer()">▶ Start Session</button>
      <button class="btn btn-secondary" onclick="resetTimer()">⏹ Reset</button>
    </div>

    <p style="font-size: 0.85rem; color: #71717a; line-height: 1.6; max-width: 440px; margin: 0 auto;">
      Records active coding time offline. When stopped, time will log directly into local SQLite <code>coding_sessions</code>.
    </p>
  </div>
</div>
